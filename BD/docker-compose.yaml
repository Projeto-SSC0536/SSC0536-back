version: "3.9"

services:
  db:
    image: postgres:16
    container_name: almox-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: almox-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: db           # hostname do serviço 'db' no Compose
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: "5432"
    restart: "no"          # roda migração e encerra
    ports:
      - "8080:8080"

volumes:
  db_data:
